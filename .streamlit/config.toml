[theme]
base = "dark"
primaryColor = "#777777"
backgroundColor = "#081014"
secondaryBackgroundColor = "#0D181D"
textColor = "#EEF6F3"
font = "sans-serif"

[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 1

[browser]
gatherUsageStats = false
